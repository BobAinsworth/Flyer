<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />
  <title>Tierra Bella Flyer</title>
  <meta name="format-detection" content="telephone=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #2b356d;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    a.flyer-link {
      display: block;
      width: 100%;
      max-width: 768px;
      text-decoration: none;
      line-height: 0;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }

    img.flyer {
      display: block;
      width: 100%;
      height: auto;
      border: 0;
    }
  </style>
</head>
<body>
  <a
    class="flyer-link"
    href="https://tierrabella.org/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Open Tierra Bella website"
  >
    <img
      class="flyer"
      src="flyer.jpg"
      alt="Tierra Bella bicycle tour flyer for April 12, 2026"
    />
  </a>
</body>
</html>
